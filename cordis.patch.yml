# ============================================================================
# dsh-corner-anim —— DSH bundle patch（挂载声明）
# ============================================================================
# DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把「右上角动画挂件」
# 插入 profile 的配置树。
#
# 安装：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# 或直接发布后：
#   dsh plugin --profile desktop add dsh-corner-anim
#
# 可选配置（不写即用默认值，全部为可选项）：
#
#   - insert:
#       - id: dsh-corner-anim
#         name: dsh-corner-anim
#         config:
#           enabled: true            # 关掉整个挂件
#           corner: top-right        # top-right | top-left | bottom-right | bottom-left
#           width: 220               # 初始显示宽度（px），也是面板「重置」的目标值
#           minWidth: 80             # 面板滑杆下限（px）
#           maxWidth: 600            # 面板滑杆上限（px）
#           offsetX: 20              # 距视口边缘的水平间距（px）
#           offsetY: 20              # 距视口边缘的垂直间距（px）
#           opacity: 1               # 0 ~ 1
#           draggable: true          # 是否允许拖动
#           showControls: true       # 是否显示「重播 / 排期 / 间隔 / 折叠 / 关闭」与设置面板
#           rememberPosition: true   # 拖动后记住位置（localStorage）
#           split: true              # 播完后是否拆成「左电饭煲 / 右小女孩」两块
#           splitAutoDetect: true    # 是否按最后一帧的 alpha 自动找分割线
#           splitRatio: 0.5          # 自动探测不可用时的兜底分割比例（0.05 ~ 0.95）
#           idle: true               # 小女孩是否播待机动画 assets/idle.webm
#           idleEvery: 5000          # 待机动画每多少毫秒起播一次（默认 5 秒）
#           idleScale: 1             # 待机动画相对小女孩那块的缩放（0.1 ~ 10）
#           act: true                # 小女孩是否播动作动画 assets/act.webm
#           actEvery: 15000          # 动作动画每多少毫秒起播一次（默认 15 秒）
#           actScale: 1              # 动作动画相对小女孩那块的缩放（0.1 ~ 10）
#           sendHook: true           # 是否启用「发送消息」联动（关掉 = 回到 0.6.0 行为）
#           sendSelector: ''         # 指定"发送按钮"的 CSS 选择器；留空 = 自动按语义找
#           sendGirlScale: 1         # 点发送后那段小女孩动画的缩放（0.1 ~ 10）
#           sendLidScale: 1          # 开盖动画的缩放（0.1 ~ 10）
#           sendLabel: '肥鱼已经煮饭：'  # 计时器上方的文案
#           sendLabelColor: '#3b82f6'   # 该文案的颜色（只接受字面颜色，防注入）
#           sendLidAudio: true       # 开盖动画是否放声（素材本身保留着音轨）
#           # ---- 0.8.0 ----
#           clickSquish: true        # 按住压扁 / 松开弹回（点击 Q 弹）
#           pressSound: true         # 按压音效总开关
#           pressVolume: 0.6         # 音效音量（0 ~ 1）
#           pipeChance: 0.07         # 按压电饭煲时改响「钢管」彩蛋音的概率
#           pipeVolume: 0.5          # 那条彩蛋音相对 pressVolume 的倍率
#           # ---- 0.9.0 ----
#           potChance: 0.1           # 按压小女孩时"从天而降一个钢盆"的概率
#           # ---- 0.10.0 ----
#           randomAnims: true        # 电饭煲两种随机动画的总开关
#           randomAChance: 0.2       # 动画1「开盖 · 空锅」的概率（播完倒放回原样）
#           randomBChance: 0.1       # 动画2「开盖 · 米饭热气」的概率（她那段 + 锅追过去）
#           randomFlightMs: 5000     # 动画2 里电饭煲"追到她"的上限时长（毫秒）
#           randomContactScale: 0.95 # 动画2 里她那一段相对她那块的高度比例
#           randomReverseMs: 1200    # 动画1 倒放的时长（毫秒）
#           randomRiceScale: 1       # 动画2 素材（米饭热气）的内容倍率
#           randomEmptyScale: 1      # 动画1 素材（空锅）的内容倍率
#           dragAnim: true           # 拖小女孩时是否播"拖动动画"（drag.webm）
#           dragScale: 1             # 拖动动画相对她那块的高度倍率
#           dragRate: 1              # 拖动动画的播放倍速
#
# 注意：用户在面板里调过的大小 / 展开状态 / **动画间隔倍率**记在浏览器
# localStorage 里，优先级高于 width 与上面的 idleEvery / actEvery，但尺寸始终夹在
# [minWidth, maxWidth] 内，倍率夹在 [0.25, 4] 内。拆分后两块的摆放位置也各自记在
# localStorage 里；只要整体没被拖动过，下次拆分就沿用它，整体一被拖动就作废、
# 重新从整体位置推导。
#
# 动画间隔（0.6.0 新增，两种改法等价）：
#   · 控制条上「⇄1×」那颗按钮：点一下在 0.5× / 1× / 2× / 4× 之间循环（到顶回卷）；
#   · 设置面板里「动画间隔」滑杆：对数刻度 0.25× ~ 4×，精细调整，中点是 1×。
#   倍率是**乘法**：idleEvery / actEvery 乘上它，上限 1 小时、下限 1 秒。
#   两条节拍同比缩放（5s/15s 在 2× 下就是 10s/30s），正在播的那段不被打断；
#   改完之后两条节拍一起从当下重新起算。
#
# 两段动画各自一条节拍，**同一时刻只播一段**：
#   · 谁的表先到点谁上；两边同时到点则动作动画优先（5 秒与 15 秒每 15 秒必撞一次）；
#   · 正在播的那段不被打断，错过的这一拍直接跳过（不排队，免得越积越多）；
#   · **每段播完都停在自己的末帧**（0.6.0 起）：不再把画面交还开场那张定格帧，
#     所以小女孩不会在每段动画结束后一跳回到开场的姿势。开场定格帧只在
#     "还没有任何动画出过画"时出画，也就是首拍之前。
# 动画的尺寸由运行时从素材 alpha 现算：内容高度贴合小女孩那块、底边对齐、
# 水平居中；觉得偏大偏小就调对应的 *Scale（0.95 / 1.05 量级即可）。
#
# 「发送消息」联动（0.7.0 新增）：
#   事件 1 —— 侦测到用户点了「发送消息」（或输入框里回车）之后：
#     a. 在右侧小女孩那块上面播 assets/girl.webm（单次、不循环）。她这一段
#        **独占画面**（0.7.3）：定格 canvas 与待机/动作两路一律让位，
#        所以屏幕上永远只有一个小女孩；
#     b. 播完 → 把控制条搬到她原来的位置对面（**电饭煲上方**）、把小女孩那块
#        整个藏起来，并在电饭煲下方显示蓝色文案 + 计时器（从这一刻开始计时）。
#   事件 2 —— 侦测到模型思考完、开始输出之后：
#     在**电饭煲原来的位置**播 assets/lid.webm（0.7.3：原地盖住那口锅，不再挂在
#     计时器下方；**带声**，被浏览器拦下时静音放画面 + 给小喇叭兜底），
#     播完停在最后一帧；**播完把蓝色文案与计时器一起收掉**（0.7.4，连带停掉那条
#     每秒读表 / 重排的定时器），直到下一条消息把整套流程重置。
#     0.7.5 起多一条前置条件：**「深度思索」必须已经结束** —— 判据是 DSH 推理行的
#     `[data-variant="think"][data-state="running"]` 一个都不在（data 属性，与构建
#     哈希无关）。思索期间一律按住不播（电饭煲保持原样），因为那段时间里在变的是
#     推理预览与「正在分析请求 / 正在调用工具」这类过程行，并不是"开始输出结果"。
#
#   两处侦测都靠观察 DOM（页面脚本读不到 React 状态），判据刻意与 class 名无关：
#     · 发送：文案/aria 命中「发送」语义的按钮被点，或输入框回车（且确实存在一颗
#       可用的发送按钮）。按钮总是"点击到达时现找"，所以 React 重挂不影响。
#     · 开始输出：先要求「深度思索」结束，再看回答正文文本是否增长超过阈值。
#   想指定按钮就用 sendSelector；想完全关掉用 sendHook: false。
#   排查用：控制台执行 window.__dshcaSend.debug() / .probe() / .simulate()。
#
# 0.7.3 的三处摆放修正（都是实测报出来的）：
#   · 开场动画播完拆成两块时，**小女孩那一块贴住窗口右边缘**（整块完整可见）。
#     素材画幅右侧有 320 源像素的透明留白，照搬"帧内原位置"她会停在离窗口边框
#     40~50px 的地方；现在只把她顶到边框上，电饭煲仍停在帧内的位置。
#     用户自己拖动过她之后就不再自动贴边；改窗口大小 / 改显示尺寸会重新贴边。
#   · 点发送后那段跑出动画**独占画面**：否则半透明的她会与"原先那张她"叠在一起。
#   · 开盖那段**原地**在电饭煲的位置播放，文案与计时器仍留在电饭煲正下方。
#
# 0.7.4：开盖那段播完，蓝色文案与计时器一起收掉（开盖画面仍停在最后一帧）；
#        下一条消息复位时它们会重新出现并从 00:00 开始走。
# 0.7.5：开盖改为**等「深度思索」结束**才播；思索期间电饭煲保持原样（既不播开盖，
#        也不藏锅）。判据是推理行的 data-state，见上面「事件 2」。
#
# 0.10.0 新增：拖动动画 + 电饭煲的两种随机动画
#   · 拖动动画（assets/drag.webm）：拖**小女孩那一块**时循环播放，松手立刻切回
#     她原来那一格（不做 C_End，用户明确选的"立刻切回"）。参考的是 VPet 的拖动
#     状态机（Raised_Dynamic → 静态），但这里用一段循环素材对应"动态"。
#     只在真的越过拖动阈值（3px）之后起播，所以"按住不动"仍旧走点击那一套。
#     拖动期间她头上的盆会一起让位（那段素材画的是"被拎起来"的样子）。
#   · 点击电饭煲时先掷两个**互斥**的骰子（一次点击最多触发一件事）：
#       ① randomAChance（默认 20%）→ 动画1「开盖 · 空锅」（assets/lid-empty.webm，
#          带原始音轨）：正常播完 → **倒放**回第 0 帧（倒放就是"变回原样"的过程）
#          → 立刻把画面交回电饭煲原来那格定格图；
#       ② randomBChance（默认 10%）→ 动画2「开盖 · 米饭热气」
#          （assets/lid-rice.webm，带原始音轨）：**同时**开始两件事 ——
#          小女孩那块播 assets/girl-basin.webm（钢盆扣在头上、左右张望），
#          电饭煲在 randomFlightMs（默认 5 秒）之内沿直线向她移动。
#          移动量不是一格一格挪，而是**一次算清**：在直线上按比例采样 160 个点，
#          用"她那块的矩形"求每个点的重叠率，取最大的那个当终点（终点不越过
#          接触点）。逐帧（requestAnimationFrame）推进，**哪一帧两块矩形真的
#          相交过半（≥50% 面积比）就算接触** —— 那一刻电饭煲立刻归位、她那段
#          收工，两边都回到各自的定格图，两条动效节拍照常继续。
#       ③ 两个都没掷中（默认 70%）→ 完全走 0.8.0 那套点击 Q 弹 + 按压音效。
#   · 随机动画播放期间：排期器停摆（演完会**原样还回去** —— 用户自己按过 ⏸ 的话
#     不会替他打开），锅那一块不接受点击 Q 弹，锅自己的定格图让位（屏幕上永远
#     只有一口锅），而**小女孩那一侧照旧**（除了动画2 里她本人被那一段替换）。
#   · 位置用 transform（CSS 变量 + 一条很短的过渡抹平两次 rAF 之间的步子），
#     绝不改 left/top —— 拖动几何与"贴窗口右边缘"那套判据读的就是 left/top。
#     ⚠️ 变量必须有东西**消费**：`.dshca-part.dshca-flying` 里的
#     `transform:translate(var(--dshca-fly-x,0px),var(--dshca-fly-y,0px))`
#     就是那个消费者。0.10.1 修的漏洞1 正是它缺席 —— 变量写了没人读，
#     JS 侧接触判定照跑、锅在画面上纹丝不动。
#   · 动画2 播放期间**她头上的盆一起让位**（她那段是"整幅替换她"，盆会悬空），
#     收工（接触复位 / 5 秒兜底 / 重播 / 关闭 / 新一轮发送）时原样复原 ——
#     这是 0.10.1 修的漏洞2，与 girl.webm / 拖动动画同一套判据。
#   · 排查用：window.__dshcaRandom.probe() / .play('lid1'|'lid2') / .drag(true|false)
#     / .stop() / .debug()（`play` / `drag` 不受概率限制，验"那 20%"就靠它）。
#
# 0.10.2 修复四处（全部真浏览器实测复现 → 修复 → 断言）：
#   ① 小女孩的动画内容不再被窗口边框吃掉：贴边间隙原来写死 2px，但"动画内容比
#      裁切框宽出来的溢出"随显示宽度线性放大，实测 300px 宽起她的身子就被窗口
#      右边框切掉一条（最多 11px）。现在由 girlSideGap() 按所有动画层（idle/act/
#      拖动/跑出/她那段 + 摞着的盆）的实际溢出现算，素材量出内容框时自动收紧。
#   ② 操作设置面板期间面板被锚定：拖「显示大小」滑杆时块每拍都在变宽变高，
#      面板原先被 layoutPanel() 一路重摆（80→600→120 一次扫动面板追逐 202px），
#      滑杆不断从光标底下溜走。现在指针按在面板上时面板钉在按下那一刻的
#      视口位置，松手后再摆一次到位。
#   ③ 开盖动画的触发条件改为「一轮对话完整结束」—— 与 dsh-whale-widget 弹
#      「本次消费金额」泡泡同一触发点。宿主半区监听 session/event 的 turn/end
#      把 seq +1（路由 GET /dsh-corner-anim/turn.json 返回 {ok,seq,ts}），客户端
#      点发送后每秒轮询，seq 变大即触发开盖（首个读数只对齐）。信号连续 3 秒
#      不可达时退回旧的"正文增长"探测，开盖不会永远不播。开盖结束后计时器照旧
#      收掉；点击停在最后一帧的开盖画面（整格可点）则复位回「电饭煲 / 小女孩」
#      各自独立可拖的拆分态，两条待机节拍接回去。
#   ④ 「重播动画」先复位发送联动再撤块：原先开盖停在末帧时点重播，冻结帧会
#      永远留在屏幕上（它挂在 body 上，摘块清不掉）、sendPhase 卡死在 'lid'、
#      分离状态的控制条带着 position:fixed 的旧视口内联回到带 filter 的宿主里
#      被二次平移（实测渲染在 x=2419 / 视口 1440，右下角屏外近千像素）。
#      merge() 现在先走 resetSendFlow()，split() 里再防御性归位一次控制条；
#      顺带修掉「末帧还原后排期不重启」（paused 标志未复位）。
# ============================================================================

- insert:
    - id: dsh-corner-anim
      name: dsh-corner-anim
